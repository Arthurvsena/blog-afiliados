# Google AdSense (passo 12 do LEIAME.md). Vazio = sem anúncios.
anuncios:
  adsense_cliente: ""        # ex.: "ca-pub-1234567890123456"
  # Blocos manuais (opcional). Sem eles, os anúncios automáticos do AdSense decidem os lugares.
  slots:
    topo: ""                 # faixa abaixo do menu
    artigo: ""               # dentro dos posts (2 vezes)
    lateral: ""              # coluna lateral
    lista: ""                # entre blocos da página inicial

# O que a rotina diária faz. Cada post consome parte do limite de uso
# da sua assinatura do Claude, então comece devagar.
rotina:
  noticias_por_dia: 5          # notícias, tutoriais e análises das editorias
  posts_novos_por_dia: 2       # guias de compra (listas, reviews, comparativos)
  atualizacoes_por_dia: 1
  palavras_minimas: 900        # para guias de compra e análises
  palavras_minimas_noticia: 400

# Editorias de notícias (como num portal). A cor e o ícone vêm de design/marca.yaml.
editorias:
  - slug: celulares
    nome: "Celulares"
    descricao: "Lançamentos, preços no Brasil, atualizações e comparativos de smartphones."
    sementes: ["lançamento celular", "novo galaxy", "novo iphone", "motorola lançamento", "xiaomi brasil"]
  - slug: games
    nome: "Games"
    descricao: "Lançamentos, consoles, atualizações e promoções de jogos."
    sementes: ["lançamento jogos", "playstation", "xbox game pass", "nintendo switch", "jogos grátis epic"]
  - slug: inteligencia-artificial
    nome: "Inteligência Artificial"
    curto: "IA"
    descricao: "Ferramentas, recursos e novidades de IA que mudam o seu dia a dia."
    sementes: ["chatgpt", "gemini google", "inteligência artificial celular", "ia grátis", "claude ia"]
  - slug: tecnologia
    nome: "Tecnologia"
    descricao: "Apps, internet, segurança digital e o que está mudando na tecnologia."
    sementes: ["whatsapp novidade", "golpe pix", "android atualização", "windows 11", "starlink brasil"]
  - slug: analises
    nome: "Análises"
    descricao: "Opinião fundamentada sobre celulares, fones e gadgets, com prós e contras."
    sementes: ["vale a pena", "review celular", "análise"]
  - slug: tutoriais
    nome: "Tutoriais"
    descricao: "Passo a passo para resolver problemas reais no celular, PC e apps."
    sementes: ["como fazer", "como configurar", "como resolver"]

# Guia de compras: subnichos com produtos e links de oferta do Mercado Livre.

subnichos:
  - slug: fones-caixas-bluetooth
    nome: "Fones e Caixas de Som Bluetooth"
    sementes: ["fone bluetooth", "fone de ouvido sem fio", "caixa de som bluetooth", "fone tws"]
  - slug: power-banks-carregadores
    nome: "Power Banks, Carregadores e Cabos"
    sementes: ["power bank", "carregador turbo", "carregador usb c", "cabo usb c"]
  - slug: smartwatches-smartbands
    nome: "Smartwatches e Smartbands"
    sementes: ["smartwatch barato", "smartband", "relógio inteligente", "mi band"]
  - slug: acessorios-gamer
    nome: "Acessórios Gamer"
    sementes: ["headset gamer", "mouse gamer", "teclado mecânico", "teclado gamer"]
  - slug: casa-inteligente
    nome: "Casa Inteligente"
    sementes: ["lâmpada inteligente", "tomada inteligente", "câmera wifi", "alexa compatível"]

