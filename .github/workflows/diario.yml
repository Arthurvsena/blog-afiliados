name: Rotina diária do blog

on:
  schedule:
    - cron: "47 11 * * *"     # 08:47 no horário de Brasília
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: blog
  cancel-in-progress: false

jobs:
  rotina:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Agentes trabalham (Claude)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: "Execute a rotina diária do blog: leia o arquivo .claude/skills/rotina-diaria/SKILL.md e siga todos os passos dele até o fim, sem pular nenhum. Chame os subagentes sempre em primeiro plano (run_in_background false) e só termine depois do último passo: esta execução não tem continuação."
          claude_args: |
            --model sonnet
            --max-turns 150
            --disallowedTools "ScheduleWakeup,Monitor,CronCreate"
            --allowedTools "Skill,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Task,Agent,Bash(python3 scripts/verificar.py:*),Bash(python3 scripts/palavras.py:*),Bash(python3 site/build.py:*),Bash(date:*),Bash(TZ=America/Sao_Paulo date:*)"

      - name: Salvar o trabalho do dia
        run: |
          git config user.name "rotina-do-blog"
          git config user.email "rotina-do-blog@users.noreply.github.com"
          git add content data design
          git diff --cached --quiet || git commit -m "Rotina diária $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          git push

      - name: Gerar o site
        run: python3 site/build.py
        env:
          ESCRITORIO_SENHA: ${{ secrets.ESCRITORIO_SENHA }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
