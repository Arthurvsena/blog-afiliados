name: Bíblia Animada (roteiros novos)

# Escreve um lote de roteiros novos (skill biblia-roteiros). Disparado sozinho pelo biblia-diario.yml
# quando a fila fica curta, ou à mão pela aba Actions.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biblia-roteiros
  cancel-in-progress: false

jobs:
  roteiros:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ferramentas (prévias das cenas)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -r requirements.txt numpy playwright
          python -m playwright install --with-deps chromium
      - name: Roteirista (Claude)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: "Escreva o lote de roteiros novos do canal Bíblia Animada: leia .claude/skills/biblia-roteiros/SKILL.md e siga todos os passos até o fim. Não faça commit: o workflow faz."
          claude_args: |
            --model sonnet
            --max-turns 250
            --disallowedTools "ScheduleWakeup,Monitor,CronCreate"
            --allowedTools "Skill,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(python3 canal-biblia/montar.py:*),Bash(python3 canal-biblia/diario.py:*),Bash(python3 -c:*),Bash(ls:*)"
      - name: Conferir e salvar
        run: |
          python3 canal-biblia/diario.py --checar
          git config user.name "rotina-biblia"
          git config user.email "rotina-biblia@users.noreply.github.com"
          git add canal-biblia/roteiros canal-biblia/fila.json
          git diff --cached --quiet || git commit -m "Bíblia Animada: roteiros novos $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          git pull --rebase -X theirs origin main && git push
