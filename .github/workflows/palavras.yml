name: Pesquisa de palavras-chave

# Toda segunda, antes da estratégia semanal: coleta o que as pessoas digitam
# no Google e no Mercado Livre e grava em data/palavras.json.
on:
  schedule:
    - cron: "7 13 * * 1"      # segunda-feira, 10:07 no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog
  cancel-in-progress: false

jobs:
  palavras:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Coletar buscas reais
        run: python3 scripts/palavras.py
      - name: Salvar
        run: |
          git config user.name "rotina-do-blog"
          git config user.email "rotina-do-blog@users.noreply.github.com"
          git add data/palavras.json
          git diff --cached --quiet || git commit -m "Palavras-chave $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          git push
