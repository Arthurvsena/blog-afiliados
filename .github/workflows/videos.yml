name: Vídeos do canal

on:
  # Disparado todo dia às 07:23 (Brasília) pela tarefa agendada "Disparar rotinas do blog e do canal":
  # o agendamento do próprio GitHub atrasava de 5 a 9 horas.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: videos
  cancel-in-progress: false

jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Ferramentas de vídeo
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
          pip install -r requirements.txt kokoro-onnx soundfile piper-tts playwright numpy scipy
          python -m playwright install --with-deps chromium
          cd video && npm ci --no-audit --no-fund && npx remotion browser ensure

      - name: Departamento de vídeo (Claude)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: "Produza os vídeos do dia do canal: leia .claude/skills/canal-diario/SKILL.md e siga a PARTE A (passos 1 a 3: pauta, roteiros, narração e montagem) até o fim, salvando os vídeos em _videos/. Não publique no YouTube: a publicação é feita depois pelo Chrome do dono. Chame os subagentes sempre em primeiro plano (run_in_background false). O vídeo longo NÃO é montado por você: ponha o caminho do roteiro dele em _videos/fila.txt (o workflow monta depois). Termine depois do último Short montado e da fila escrita."
          claude_args: |
            --model sonnet
            --max-turns 300
            --disallowedTools "ScheduleWakeup,Monitor,CronCreate"
            --allowedTools "Skill,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Task,Agent,Bash(python3 scripts/video_motion.py:*),Bash(python3 scripts/video.py:*),Bash(python3 scripts/mural.py:*),Bash(python3 -c:*),Bash(ffmpeg:*),Bash(ffprobe:*),Bash(ls:*),Bash(date:*),Bash(TZ=America/Sao_Paulo date:*)"

      - name: Montar os vídeos que faltaram (longos e os que o Claude não terminou)
        # A ferramenta de comandos do Claude corta tudo que passa de 10 minutos: o vídeo longo em 1080p
        # é montado aqui, sem limite de tempo. Também refaz qualquer .mp4 quebrado.
        run: |
          mkdir -p _videos
          touch _videos/fila.txt
          for r in $(cat _videos/fila.txt); do
            slug=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['slug'])" "$r")
            if ffprobe -v error -show_entries format=duration -of csv=p=0 "_videos/$slug.mp4" >/dev/null 2>&1; then
              echo "OK: $slug já montado"; continue
            fi
            echo "Montando $slug..."
            python3 scripts/video_motion.py "$r" --saida _videos || python3 scripts/video.py "$r" --saida _videos || echo "FALHOU: $slug"
          done
          # nada quebrado vai para o Release
          for v in _videos/*.mp4; do
            [ -e "$v" ] || continue
            ffprobe -v error -show_entries format=duration -of csv=p=0 "$v" >/dev/null 2>&1 || { echo "Removendo vídeo quebrado: $v"; rm -f "$v"; }
          done
          rm -f _videos/*.parcial.mp4 _videos/fila.txt

      - name: Publicar os vídeos num Release (o Chrome do dono baixa daqui)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIA=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          ls _videos/*.mp4 >/dev/null 2>&1 || { echo "Nenhum vídeo montado hoje."; exit 0; }
          gh release delete "videos-$DIA" -y --cleanup-tag 2>/dev/null || true
          gh release create "videos-$DIA" _videos/* --title "Vídeos de $DIA" --notes "Vídeos do canal Nexus Tech montados em $DIA. Publicados no YouTube pela tarefa do Chrome." --prerelease

      - name: Salvar roteiros
        run: |
          git config user.name "rotina-do-blog"
          git config user.email "rotina-do-blog@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Roteiros de vídeo $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          git pull --rebase -X theirs origin main && git push
