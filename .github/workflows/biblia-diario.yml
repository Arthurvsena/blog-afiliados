name: Bíblia Animada (vídeos do dia)

# Disparado todo dia pela tarefa agendada "Disparar rotinas do blog e do canal" (o agendamento do GitHub atrasa horas).
# Monta os vídeos do dia (canal-biblia/diario.py) e publica num Release biblia-AAAA-MM-DD;
# a tarefa "Bíblia Animada: publicar" (Chrome do Arthur) posta no YouTube, no TikTok e salva no Drive.
on:
  workflow_dispatch:
    inputs:
      quantos:
        description: "Quantos vídeos montar"
        default: "2"

permissions:
  contents: write
  actions: write

concurrency:
  group: biblia
  cancel-in-progress: false

jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ferramentas
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -r requirements.txt numpy playwright
          python -m playwright install --with-deps chromium
      - name: Conferir roteiros
        run: python3 canal-biblia/diario.py --checar
      - name: Montar os vídeos do dia
        run: python3 canal-biblia/diario.py --saida _biblia --quantos "${{ github.event.inputs.quantos || '2' }}"
      - name: Publicar num Release (a tarefa do Chrome baixa daqui)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIA=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          ls _biblia/*.mp4 >/dev/null 2>&1 || { echo "Nenhum vídeo montado hoje."; exit 0; }
          if gh release view "biblia-$DIA" >/dev/null 2>&1; then
            gh release upload "biblia-$DIA" _biblia/*.mp4 _biblia/*.txt _biblia/*.json --clobber
          else
            gh release create "biblia-$DIA" _biblia/*.mp4 _biblia/*.txt _biblia/*.json --title "Bíblia Animada $DIA" --notes "Vídeos do canal Bíblia Animada montados em $DIA." --prerelease
          fi
      - name: Salvar a fila
        run: |
          git config user.name "rotina-biblia"
          git config user.email "rotina-biblia@users.noreply.github.com"
          git add canal-biblia/fila.json
          git diff --cached --quiet || git commit -m "Bíblia Animada: vídeos de $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          git pull --rebase -X theirs origin main && git push
      - name: Pedir roteiros novos se a fila estiver acabando
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESTANTES=$(cat _biblia/_restantes.txt 2>/dev/null || echo 99)
          MINIMO=$(python3 -c "import yaml;print(yaml.safe_load(open('canal-biblia/config.yaml'))['producao']['fila_minima'])")
          if [ "$RESTANTES" -lt "$MINIMO" ]; then
            echo "Fila com $RESTANTES roteiros: pedindo um lote novo."
            gh workflow run biblia-roteiros.yml --ref main || echo "não consegui disparar o roteirista"
          fi
