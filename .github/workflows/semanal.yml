name: Reunião semanal de estratégia

on:
  schedule:
    - cron: "31 14 * * 1"     # segunda-feira, 11:31 no horário de Brasília (depois da coleta de métricas)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: blog
  cancel-in-progress: false

jobs:
  estrategia:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Reunião da equipe (Claude)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "Conduza a reunião semanal de estratégia do blog: leia o arquivo .claude/skills/estrategia-seo/SKILL.md e siga todos os passos dele até o fim, sem pular nenhum. Chame os subagentes sempre em primeiro plano (run_in_background false) e só termine depois do último passo: esta execução não tem continuação."
          claude_args: |
            --model sonnet
            --max-turns 160
            --disallowedTools "ScheduleWakeup,Monitor,CronCreate"
            --allowedTools "Skill,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Task,Agent,Bash(python3 scripts/verificar.py:*),Bash(python3 scripts/mural.py:*),Bash(python3 scripts/imagem.py:*),Bash(python3 scripts/palavras.py:*),Bash(date:*),Bash(TZ=America/Sao_Paulo date:*)"

      - name: Salvar
        run: |
          git config user.name "rotina-do-blog"
          git config user.email "rotina-do-blog@users.noreply.github.com"
          git add data design content
          git diff --cached --quiet || git commit -m "Estratégia semanal $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          git pull --rebase origin main && git push

      - name: Gerar o site
        run: python3 site/build.py
        env:
          ESCRITORIO_SENHA: ${{ secrets.ESCRITORIO_SENHA }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
