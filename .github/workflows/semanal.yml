name: Estratégia semanal de SEO

on:
  schedule:
    - cron: "31 10 * * 1"     # segunda-feira, 07:31 no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: blog
  cancel-in-progress: false

jobs:
  estrategia:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Estrategista e curador trabalham (Claude)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "Execute a estratégia semanal do blog: leia o arquivo .claude/skills/estrategia-seo/SKILL.md e siga todos os passos dele até o fim, sem pular nenhum."
          claude_args: |
            --model sonnet
            --max-turns 100
            --allowedTools "Skill,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Task,Agent,Bash(python3 scripts/verificar.py:*),Bash(date:*),Bash(TZ=America/Sao_Paulo date:*)"

      - name: Salvar
        run: |
          git config user.name "rotina-do-blog"
          git config user.email "rotina-do-blog@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Estratégia semanal $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          git push

      - run: python3 site/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
