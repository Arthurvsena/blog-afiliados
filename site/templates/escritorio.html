<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Escritório | {{ site.nome }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0e1020; --painel:#181b33; --borda:#3b4175; --texto:#e6e8ff; --suave:#9aa0d0;
          --ok:#5ee08a; --ocioso:#ffd166; --erro:#ff5d73; --destaque:#7aa2ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--texto); font:22px/1.25 "VT323", monospace; }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  h1, h2 { font-family:"Press Start 2P", monospace; font-weight:400; margin:0; }
  h1 { font-size:clamp(13px,2.4vw,20px); color:var(--ocioso); text-shadow:3px 3px 0 #000; }
  h2 { font-size:12px; color:var(--destaque); margin:26px 0 12px; }
  a { color:var(--destaque); }
  .ultima { color:var(--suave); font-size:20px; }
  .cena { position:relative; border:4px solid var(--borda); box-shadow:0 0 0 4px #000, 8px 8px 0 4px #000; background:#000; }
  canvas { display:block; width:100%; image-rendering:pixelated; image-rendering:crisp-edges; }
  .rotulo { position:absolute; transform:translate(-50%,-100%); transition:none; background:#fff; color:#111; border:2px solid #000;
            padding:1px 6px 2px; font-size:clamp(11px,1.6vw,19px); white-space:nowrap; cursor:pointer; pointer-events:auto; }
  .rotulo::after { content:""; position:absolute; left:50%; bottom:-6px; margin-left:-4px; border:4px solid transparent; border-top-color:#000; }
  .rotulo .pt { display:inline-block; width:8px; height:8px; margin-right:5px; border:1px solid #000; }
  .rotulo.ativo { background:var(--ocioso); }
  .sobre { position:absolute; color:#1b2a12; font-size:clamp(9px,1.35vw,17px); line-height:1.05; pointer-events:none; }
  .sala-nome { position:absolute; font-family:"Press Start 2P",monospace; font-size:clamp(5px,0.85vw,10px); color:#e6e8ff; background:#0008; padding:2px 4px; pointer-events:none; }
  .rotulo.vivo { background:#5ee08a; }
  .aovivo { margin:10px 0 0; font-size:21px; }
  .pisca { color:#5ee08a; animation:pisca 1s steps(2) infinite; }
  @keyframes pisca { 50% { opacity:.2; } }
  .relogio { position:absolute; color:#7dff9b; font-family:"Press Start 2P",monospace; font-size:clamp(5px,0.9vw,10px); transform:translate(-50%,-50%); pointer-events:none; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .stat { background:var(--painel); border:3px solid var(--borda); padding:10px 12px; box-shadow:4px 4px 0 #000; }
  .stat b { display:block; font-family:"Press Start 2P",monospace; font-size:20px; color:var(--ocioso); margin-bottom:6px; }
  .equipe { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .agente { background:var(--painel); border:3px solid var(--borda); padding:12px; box-shadow:4px 4px 0 #000; cursor:pointer; }
  .agente.ativo { border-color:var(--ocioso); }
  .agente .nome { font-family:"Press Start 2P",monospace; font-size:10px; display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .agente .cor { width:14px; height:14px; border:2px solid #000; flex-shrink:0; }
  .agente .cargo { color:var(--suave); font-size:18px; }
  .agente .tarefa { margin-top:6px; }
  .st { font-size:17px; padding:0 6px; border:2px solid #000; color:#000; }
  .st.ok { background:var(--ok); } .st.ocioso { background:var(--ocioso); } .st.erro { background:var(--erro); }
  .log { background:#05060d; border:3px solid var(--borda); padding:12px 14px; max-height:340px; overflow:auto; box-shadow:4px 4px 0 #000; }
  .log div { padding:2px 0; border-bottom:1px dashed #1f2340; }
  .log .d { color:var(--suave); } .log .a { color:var(--ocioso); }
  .vazio { color:var(--suave); }
  .yt { background:var(--painel); border:3px solid var(--borda); padding:12px 16px; box-shadow:4px 4px 0 #000; margin-top:12px; }
  .yt h3 { font-family:"Press Start 2P",monospace; font-size:10px; color:var(--destaque); margin:14px 0 8px; font-weight:400; }
  .yt .fala { border-left:4px solid var(--ocioso); padding:4px 10px; margin:6px 0 4px; }
  .yt ul { margin:4px 0; padding-left:20px; } .yt li { margin:4px 0; }
  .yt .bom li::marker { content:"✔ "; color:var(--ok); } .yt .ruim li::marker { content:"✖ "; color:var(--erro); } .yt .faz li::marker { content:"➜ "; color:var(--ocioso); }
  .ytt { width:100%; border-collapse:collapse; font-size:18px; margin-top:6px; }
  .ytt th, .ytt td { border:2px solid var(--borda); padding:3px 6px; text-align:left; vertical-align:top; }
  .ytt th { color:var(--destaque); } .ytt td.n { text-align:right; white-space:nowrap; }
  .barra { display:inline-block; height:10px; background:var(--ok); vertical-align:middle; margin-right:4px; border:1px solid #000; }
  .ytwrap { overflow-x:auto; }
  .plano { background:var(--painel); border:3px solid var(--borda); padding:6px 18px 14px; box-shadow:4px 4px 0 #000; }
  .plano h1 { display:none; } .plano blockquote { margin:10px 0; color:var(--suave); }
  .plano h2 { font-size:10px; color:var(--ocioso); margin:20px 0 8px; }
  .plano table { width:100%; border-collapse:collapse; font-size:19px; }
  .plano th, .plano td { border:2px solid var(--borda); padding:4px 8px; text-align:left; }
  .plano th { color:var(--destaque); } .plano li { margin:4px 0; }
  .mural { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; }
  .bilhete { padding:12px 14px; border:3px solid #000; box-shadow:4px 4px 0 #000; color:#1a1a1a; background:#fff6a8; transform:rotate(-.6deg); }
  .bilhete:nth-child(even) { transform:rotate(.7deg); background:#c9f2ff; }
  .bilhete.feito { background:#d6ffd8; opacity:.85; }
  .bilhete .rota { font-family:"Press Start 2P",monospace; font-size:9px; display:flex; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .bilhete .meta-tag { background:#000; color:#fff; padding:1px 5px; }
  .bilhete b { display:block; font-size:21px; margin-bottom:2px; }
  .bilhete .resp { margin-top:6px; border-top:2px dashed #0005; padding-top:4px; font-size:18px; }
  .rotulo .cartas { margin-left:5px; background:#ff5d73; color:#fff; padding:0 4px; font-size:.85em; }
  footer { color:var(--suave); margin:30px 0 10px; font-size:18px; }
  @media (max-width:640px) { .rotulo .txt { display:none; } .rotulo .pt { margin:0; } .sobre { display:none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>▶ ESCRITÓRIO {{ site.nome | upper }}</h1>
    <span class="ultima" id="ultima"></span>
  </header>

  <div class="cena" id="cena-box">
    <canvas id="cena" aria-label="Escritório em pixel art dividido em departamentos, com os agentes trabalhando"></canvas>
  </div>
  <div class="aovivo" id="aovivo">Conferindo quem está trabalhando...</div>

  <h2>QUADRO DE METAS</h2>
  <div class="stats" id="stats"></div>

  <h2>CANAL DO YOUTUBE</h2>
  <div class="stats" id="ytstats"></div>
  <div class="yt" id="yt"></div>

  <h2>TIKTOK · SEGURA AÍ 3D</h2>
  <div class="stats" id="tkstats"></div>

  <h2>EQUIPE</h2>
  <div class="equipe" id="equipe"></div>

  <h2>PLANO DA SEMANA</h2>
  <div class="plano" id="plano"></div>

  <h2>MURAL DA EQUIPE</h2>
  <div class="mural" id="mural"></div>

  <h2>REGISTRO</h2>
  <div class="log" id="log"></div>

  <footer>Atualizado automaticamente pela rotina diária · <a href="{{ b }}/">voltar ao blog</a></footer>
</div>

<script id="dados" type="application/json">{{ dados_json | safe }}</script>
<script>
(() => {
const D = JSON.parse(document.getElementById('dados').textContent);
const REPO = 'Arthurvsena/blog-afiliados';
// Tela lógica de 480x300 "pixels", desenhada em dobro para ficar nítida.
const W = 480, H = 300, ESC = 2;
const cv = document.getElementById('cena'), box = document.getElementById('cena-box');
cv.width = W * ESC; cv.height = H * ESC;
const g = cv.getContext('2d');
g.imageSmoothingEnabled = false; g.scale(ESC, ESC);
const P = (c, x, y, w = 1, h = 1) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };

// ---------- departamentos (salas) ----------
const SALAS = [
  { id:'redacao', nome:'REDAÇÃO NEXUS', x:4,   y:4,   w:272, h:148, piso:['#5b4636','#634d3b'], parede:'#2b3a55', faixa:'#2f4060' },
  { id:'metricas',nome:'MÉTRICAS',      x:280, y:4,   w:96,  h:70,  piso:['#3a4a5e','#40526a'], parede:'#24324a', faixa:'#2a3a56' },
  { id:'copa',    nome:'COPA',          x:280, y:78,  w:96,  h:74,  piso:['#6b5a3a','#75633f'], parede:'#4a3a2a', faixa:'#55432f' },
  { id:'youtube', nome:'ESTÚDIO YOUTUBE', x:380, y:4, w:96,  h:148, piso:['#3b2f45','#43354f'], parede:'#2a1f33', faixa:'#33263d' },
  { id:'biblia',  nome:'ESTÚDIO BÍBLIA ANIMADA', x:4, y:178, w:176, h:118, piso:['#5e5236','#685b3c'], parede:'#3d3322', faixa:'#463b27' },
  { id:'tiktok',  nome:'ESTÚDIO TIKTOK · SEGURA AÍ 3D', x:184, y:178, w:292, h:118, piso:['#263a3a','#2b4242'], parede:'#152626', faixa:'#1b2f2f' },
];
const PAREDE = 16;   // altura da parede no topo de cada sala

// ---------- equipe (personagens originais) ----------
// mesa: onde o agente senta; estacao: aonde vai quando está trabalhando de verdade
const AG = [
  { id:'pesquisador', sala:'redacao', nome:'Pesquisador', cargo:'Caça pautas no Google', mesa:[36,62],  estacao:[136,36], cam:'#3d7be0', cab:'#2e1d12', pele:'#f1c29b', acc:'oculos' },
  { id:'curador',     sala:'redacao', nome:'Curador',     cargo:'Escolhe os produtos e gera os links', mesa:[94,62], estacao:[200,36], cam:'#e0803d', cab:'#c9a227', pele:'#d9a074', acc:'bone', aux:'#c23b3b' },
  { id:'redator',     sala:'redacao', nome:'Redator',     cargo:'Escreve os posts', mesa:[152,62], estacao:[136,36], cam:'#8a4fd6', cab:'#151515', pele:'#8d5a3b', acc:'fone', aux:'#5ee08a' },
  { id:'seo',         sala:'redacao', nome:'Estrategista SEO', cargo:'Leva o blog ao topo do Google', mesa:[210,62], estacao:[64,36], cam:'#2bb39a', cab:'#0f0f0f', pele:'#5a3825', acc:'curto' },
  { id:'vendas',      sala:'redacao', nome:'Vendas',      cargo:'Faz cada post levar à compra', mesa:[36,122], estacao:[64,36], cam:'#e0b23d', cab:'#c4461c', pele:'#f6d6bd', acc:'ruiva' },
  { id:'designer',    sala:'redacao', nome:'Designer',    cargo:'Cuida da marca e da cara de cada post', mesa:[94,122], estacao:[248,96], cam:'#7C5CFF', cab:'#e8c27a', pele:'#c98f6b', acc:'boina', aux:'#14213D' },
  { id:'atualizador', sala:'redacao', nome:'Atualizador', cargo:'Mantém posts frescos', mesa:[152,122], estacao:[200,36], cam:'#d64f7a', cab:'#121212', pele:'#f1cdb0', acc:'barba', forte:true },
  { id:'viral',       sala:'redacao', nome:'Viral',       cargo:'Faz os posts se espalharem', mesa:[210,122], estacao:[248,96], cam:'#ff5d73', cab:'#2a1a12', pele:'#c98f6b', acc:'bone', aux:'#111' },
  { id:'analista',    sala:'metricas', nome:'Analista',   cargo:'Lê visitas, cliques e pedidos', mesa:[328,56], estacao:[358,30], cam:'#2f9e6e', cab:'#4a2c1a', pele:'#e8b98f', acc:'redondo' },
  { id:'tendencias',  sala:'youtube', nome:'Tendências',  cargo:'Caça o que está em alta', mesa:[428,52], estacao:[402,30], cam:'#14b8a6', cab:'#6b3b1f', pele:'#d9a074', acc:'oculos' },
  { id:'produtor',    sala:'youtube', nome:'Produtor',    cargo:'Comanda o canal no YouTube', mesa:[404,122], estacao:[456,92], cam:'#1f2937', cab:'#e8e8e8', pele:'#e8b98f', acc:'fone', aux:'#ff5d73' },
  { id:'roteirista',  sala:'youtube', nome:'Roteirista',  cargo:'Escreve os roteiros dos vídeos', mesa:[452,122], estacao:[402,30], cam:'#f59e0b', cab:'#3b2416', pele:'#a86b4a', acc:'longo' },
  { id:'bib_roteirista', sala:'biblia', nome:'Roteirista bíblico', cargo:'Escreve as histórias da Bíblia', mesa:[44,236], estacao:[150,208], cam:'#a3414f', cab:'#2b1a10', pele:'#c98f6b', acc:'coque' },
  { id:'bib_animador',   sala:'biblia', nome:'Animador 2D', cargo:'Desenha e monta os vídeos da Bíblia', mesa:[110,236], estacao:[150,270], cam:'#c9a45a', cab:'#151515', pele:'#f1c29b', acc:'fone', aux:'#5a7f9c' },
  { id:'seg_roteirista', sala:'tiktok', nome:'Roteirista 3D', cargo:'Pesquisa as normas e escreve os roteiros', mesa:[210,236], estacao:[300,208], cam:'#ff7a1a', cab:'#4a2c1a', pele:'#f2b98a', acc:'capacete', aux:'#ffb300' },
  { id:'seg_animador',   sala:'tiktok', nome:'Animador 3D', cargo:'Anima as cenas em 3D', mesa:[262,236], estacao:[444,206], cam:'#2f4fa8', cab:'#151515', pele:'#d9a074', acc:'oculos' },
  { id:'seg_narrador',   sala:'tiktok', nome:'Narrador', cargo:'Dá voz aos vídeos (Gemini)', mesa:[314,236], estacao:[388,270], cam:'#22b35e', cab:'#6b3b1f', pele:'#8d5a3b', acc:'fone', aux:'#ffd23f' },
  { id:'seg_publicador', sala:'tiktok', nome:'Publicador', cargo:'Agenda os vídeos no TikTok pelo Chrome', mesa:[366,236], estacao:[444,270], cam:'#ff3b6b', cab:'#c9a227', pele:'#f6d6bd', acc:'bone', aux:'#111' },
  { id:'seg_testador',   sala:'tiktok', nome:'Testador', cargo:'Testa ganchos, legendas, hashtags e horários e firma o que dá mais views', mesa:[418,236], estacao:[300,208], cam:'#8a4fd6', cab:'#151515', pele:'#c98f6b', acc:'redondo' },
];
const CHEFE = { id:'chefe', nome:'Editor-chefe', cargo:'Coordena a rotina', cam:'#2a2f45', cab:'#3b2a20', pele:'#e8b98f', acc:'gravata', aux:'#ff5d73' };
AG.forEach((a, i) => { a.seed = i * 37; a.x = a.mesa[0]; a.y = a.mesa[1] - 6; a.fase = 'mesa'; a.timer = (i * 13) % 40; });
const APELIDOS = D.equipe || {};
[...AG, CHEFE].forEach(a => { a.funcao = a.nome; if (APELIDOS[a.id]) a.nome = APELIDOS[a.id]; });

// rotinas (workflows do GitHub) -> quem trabalha nelas
const ROTINAS = {
  'diario.yml': ['chefe','pesquisador','curador','redator','seo','vendas','designer','atualizador','viral'],
  'palavras.yml': ['pesquisador','seo'],
  'semanal.yml': ['chefe','analista','seo','vendas'],
  'publicar.yml': ['designer'],
  'videos.yml': ['tendencias','produtor','roteirista'],
  'teste-voz.yml': ['produtor'],
  'biblia-roteiros.yml': ['bib_roteirista'],
  'biblia-diario.yml': ['bib_animador'],
  'biblia-piloto.yml': ['bib_animador'],
  'segura-roteiros.yml': ['seg_roteirista'],
  'segura-diario.yml': ['seg_animador','seg_narrador'],
};

const agoraSP = () => new Date(new Date().toLocaleString('en-US', { timeZone:'America/Sao_Paulo' }));
const hojeSP = () => { const d = agoraSP(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const info = id => (D.agentes && D.agentes[id]) || { status:'ocioso', tarefa:'Aguardando a primeira rotina.' };
const noite = () => { const h = agoraSP().getHours(); return h >= 22 || h < 6; };

// ---------- quem está trabalhando AGORA (de verdade) ----------
const AO_VIVO = { agentes:{}, rotinas:[], ok:null, quando:null };
async function atualizarAoVivo() {
  const ativos = {}, rotinas = [];
  let ok = true;
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/actions/runs?per_page=30`, { cache:'no-store' });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    for (const run of j.workflow_runs || []) {
      if (!['in_progress','queued','waiting','pending','requested'].includes(run.status)) continue;
      const arq = (run.path || '').split('/').pop();
      const quem = ROTINAS[arq] || [];
      rotinas.push(run.name);
      quem.forEach(id => ativos[id] = { tarefa: `Rodando: ${run.name}`, desde: run.run_started_at || run.created_at });
    }
  } catch (e) { ok = false; }
  try {   // tarefas no Chrome do Arthur avisam por data/ao_vivo.json
    const r = await fetch(`https://raw.githubusercontent.com/${REPO}/main/data/ao_vivo.json?t=${Date.now()}`, { cache:'no-store' });
    if (r.ok) {
      const j = await r.json();
      for (const [id, v] of Object.entries(j.agentes || {})) {
        if (Date.now() - new Date(v.desde).getTime() < 3 * 3600e3) ativos[id] = v;
      }
    }
  } catch (e) {}
  AO_VIVO.agentes = ativos; AO_VIVO.rotinas = rotinas; AO_VIVO.ok = ok; AO_VIVO.quando = agoraSP();
  painelAoVivo();
}
function estado(id) {
  if (AO_VIVO.agentes[id]) return 'trabalhando';
  if (info(id).status === 'erro') return 'erro';
  if (noite()) return 'dormindo';
  return 'ocioso';
}

// ---------- cenário ----------
function sala(s, t) {
  for (let y = s.y + PAREDE; y < s.y + s.h; y += 12) for (let x = s.x; x < s.x + s.w; x += 12)
    P(((x + y) / 12) % 2 ? s.piso[0] : s.piso[1], x, y, Math.min(12, s.x + s.w - x), Math.min(12, s.y + s.h - y));
  P(s.parede, s.x, s.y, s.w, PAREDE);
  for (let x = s.x; x < s.x + s.w; x += 16) P(s.faixa, x, s.y, 8, PAREDE);
  P('#151a26', s.x, s.y + PAREDE - 2, s.w, 2);
  // contorno (paredes) com porta na parte de baixo
  P('#0b0e16', s.x - 2, s.y - 2, s.w + 4, 2); P('#0b0e16', s.x - 2, s.y - 2, 2, s.h + 4); P('#0b0e16', s.x + s.w, s.y - 2, 2, s.h + 4);
  const porta = s.y > 150 ? 'cima' : 'baixo';
  const py = porta === 'baixo' ? s.y + s.h : s.y - 2, mx = s.x + s.w / 2;
  P('#0b0e16', s.x - 2, py, mx - 14 - s.x + 2, 2); P('#0b0e16', mx + 14, py, s.x + s.w - mx - 12, 2);
}
function decoracao(t) {
  const n = noite();
  // corredor
  for (let x = 0; x < W; x += 12) P(x % 24 ? '#3a3f4f' : '#353a49', x, 154, 12, 22);
  P('#4a3d5e', 8, 160, W - 16, 10);
  // REDAÇÃO: janela, quadro de metas, servidor, impressora
  P('#10141f', 120, 1, 50, 14); P(n ? '#0f1a3a' : '#8fd3ff', 122, 2, 46, 12); if (!n) P('#ffe066', 158, 4, 5, 5);
  P('#8a6a4a', 10, 2, 44, 13); P('#e9ecef', 12, 3, 40, 11);
  P('#1a1d26', 230, 2, 22, 14); for (let r = 0; r < 3; r++) for (let l = 0; l < 4; l++) P(((t + r * 3 + l * 5) % 14) < 7 ? '#5ee08a' : '#1d4d2c', 233 + l * 4, 4 + r * 4, 2, 2);
  P('#ddd', 128, 28, 18, 10); P('#999', 130, 26, 14, 3); P('#fff', 131, 24, 12, 3);                     // impressora (estação)
  P('#c9a227', 194, 28, 14, 10); P('#8a6a14', 194, 28, 14, 2);                                          // caixas de produtos
  P('#e9ecef', 56, 22, 20, 14); P('#7C5CFF', 58, 26, 4, 8); P('#2bb39a', 64, 30, 4, 4); P('#ff5d73', 70, 24, 4, 10); // gráfico de SEO
  P('#222', 240, 86, 18, 12); P('#ff5d73', 243, 89, 12, 6);                                             // mesa de luz do designer/viral
  // MÉTRICAS: telão com gráfico
  P('#10141f', 344, 1, 30, 14); P('#0b1a12', 346, 2, 26, 12);
  [[348,10],[352,8],[356,9],[360,5],[364,6],[368,3]].forEach(([x,y]) => P('#5ee08a', x, y + 1, 3, 13 - y));
  // COPA: cafeteira, sofá, plantinha
  P('#4e3a2b', 284, 98, 30, 6); P('#2b2b2b', 290, 86, 12, 12); P('#ff5d73', 299, 94, 1, 1); if (t % 16 < 8) P('#ffffff88', 295, 82 - (t % 8) / 3, 1, 2);

// ---------- pessoas ----------
function pessoa(px, py, c, t, modo) {
  const dorm = modo === 'dormindo', trab = modo === 'trabalhando';
  const dy = dorm ? 2 : 0;
  if (c.forte) P(c.cam, px, py + 9, 12, 8); else P(c.cam, px + 1, py + 9, 10, 8);
  P(c.pele, px + 5, py + 9, 2, 1);
  if (c.acc === 'gravata') { P('#fff', px + 4, py + 9, 4, 3); P(c.aux, px + 5, py + 9, 2, 6); }
  P(c.pele, px + 2, py + 2 + dy, 8, 7);
  P(c.cab, px + 2, py + dy, 8, 3); P(c.cab, px + 2, py + 3 + dy, 1, 3); P(c.cab, px + 9, py + 3 + dy, 1, 3);
  if (dorm) { P('#3a2a20', px + 3, py + 6 + dy, 2, 1); P('#3a2a20', px + 7, py + 6 + dy, 2, 1); }
  else if ((t + c.seed) % 70 < 3) { P('#3a2a20', px + 3, py + 5, 2, 1); P('#3a2a20', px + 7, py + 5, 2, 1); }
  else { P('#1b1b1b', px + 4, py + 4, 1, 2); P('#1b1b1b', px + 7, py + 4, 1, 2); }
  P('#b5735a', px + 5, py + 7 + dy, 2, 1);
  switch (c.acc) {
    case 'oculos': P('#111', px + 3, py + 3, 3, 1); P('#111', px + 6, py + 3, 3, 1); P('#111', px + 3, py + 4, 1, 2); P('#111', px + 8, py + 4, 1, 2); break;
    case 'bone': P(c.aux, px + 1, py - 1 + dy, 10, 3); P(c.aux, px + 9, py + 1 + dy, 4, 1); break;
    case 'capacete': P(c.aux, px + 1, py - 2 + dy, 10, 4); P(c.aux, px, py + 1 + dy, 12, 1); P('#ffe08a', px + 3, py - 1 + dy, 2, 1); break;
    case 'fone': P('#222', px + 1, py - 1 + dy, 10, 1); P('#222', px + 1, py + dy, 1, 4); P('#222', px + 10, py + dy, 1, 4); P(c.aux, px, py + 3 + dy, 2, 3); P(c.aux, px + 10, py + 3 + dy, 2, 3); break;
    case 'coque': P(c.cab, px + 4, py - 3 + dy, 4, 3); break;
    case 'barba': P(c.cab, px + 2, py + 7 + dy, 8, 2); P(c.pele, px + 5, py + 7 + dy, 2, 1); break;
    case 'gravata': P(c.cab, px + 3, py - 1, 6, 1); break;
    case 'redondo':
      P(c.cab, px + 1, py - 1 + dy, 10, 2); P(c.cab, px + 1, py + 1 + dy, 2, 9); P(c.cab, px + 9, py + 1 + dy, 2, 9);
      P('#111', px + 3, py + 3, 2, 1); P('#111', px + 7, py + 3, 2, 1); P('#111', px + 3, py + 5, 2, 1); P('#111', px + 7, py + 5, 2, 1); break;
    case 'curto': P(c.pele, px + 2, py + 4 + dy, 1, 2); P(c.pele, px + 9, py + 4 + dy, 1, 2); P(c.cab, px + 2, py - 1 + dy, 8, 1); break;
    case 'ruiva': P(c.cab, px + 1, py - 1 + dy, 10, 2); P(c.cab, px + 1, py + 1 + dy, 2, 10); P(c.cab, px + 9, py + 1 + dy, 2, 10); break;
    case 'longo': P(c.cab, px + 1, py + 1 + dy, 2, 9); P(c.cab, px + 9, py + 1 + dy, 2, 9); break;
    case 'boina': P(c.aux, px + 1, py - 1 + dy, 10, 3); P(c.aux, px + 2, py - 2 + dy, 8, 1); break;
  }
  const f = Math.floor((t + c.seed) / 2) % 2;
  if (trab) { P(c.cam, px - 1, py + 10, 2, 5); P(c.cam, px + 11, py + 10, 2, 5); P(c.pele, px, py + 14 - f, 3, 2); P(c.pele, px + 9, py + 13 + f, 3, 2); }
  else { P(c.cam, px - 1, py + 10, 2, 6); P(c.cam, px + 11, py + 10, 2, 6); }
  if (dorm) zzz(px + 12, py - 4, t + c.seed);
  if (modo === 'erro') { P('#ff5d73', px + 5, py - 9, 2, 5); P('#ff5d73', px + 5, py - 3, 2, 2); }
}
function pernas(px, py, t, andando, c) {
  const f = andando ? Math.floor((t + c.seed) / 3) % 2 : 0;
  P('#1d2030', px + 2, py + 17, 3, 4 + f); P('#1d2030', px + 7, py + 17, 3, 5 - f);
  P('#111', px + 1, py + 20 + f, 4, 2); P('#111', px + 7, py + 21 - f, 4, 2);
}
function zzz(x, y, t) { const o = (t / 4) % 12; [[0,0],[1,0],[2,0],[1,1],[0,2],[1,2],[2,2]].forEach(([a,b]) => P('#c8d2ff', x + a + o / 4, y + b - o / 2, 1, 1)); }
function mesaDe(a, t, modo) {
  const [x, y] = a.mesa;
  const tela = modo === 'trabalhando' ? (t % 10 < 8 ? '#9fe8ff' : '#7fd0ff') : (modo === 'dormindo' ? '#111' : '#2a3350');
  P('#c9ccd3', x - 6, y - 10, 13, 10); P(tela, x - 5, y - 9, 11, 7); P('#9aa0aa', x - 8, y - 1, 16, 1);
  P('#8a5a33', x - 20, y, 40, 4); P('#6b4425', x - 20, y + 4, 40, 10); P('#5a381d', x - 20, y + 4, 40, 1);
  P('#4e3019', x - 19, y + 14, 3, 2); P('#4e3019', x + 16, y + 14, 3, 2);
  P('#e8e8e8', x - 17, y - 3, 3, 3);
  if (modo === 'trabalhando' && t % 12 < 6) P('#ffffff99', x - 16, y - 6 - (t % 6) / 3, 1, 2);
}

// ---------- movimento: só quem está trabalhando anda ----------
function mover(a, modo) {
  const [mx, my] = a.mesa, [ex, ey] = a.estacao;
  const alvoMesa = [mx, my - 6];
  if (modo !== 'trabalhando') {              // volta para a mesa e fica
    const [tx, ty] = alvoMesa; const d = Math.hypot(tx - a.x, ty - a.y);
    if (d > 1) { a.x += (tx - a.x) / d * 1.1; a.y += (ty - a.y) / d * 1.1; a.andando = true; } else { a.x = tx; a.y = ty; a.andando = false; }
    a.fase = 'mesa'; return;
  }
  if (a.timer > 0) { a.timer--; a.andando = false; return; }
  const [tx, ty] = a.fase === 'indo' ? [ex, ey] : alvoMesa;
  const d = Math.hypot(tx - a.x, ty - a.y);
  if (d < 1.2) {
    a.x = tx; a.y = ty; a.andando = false;
    if (a.fase === 'indo') { a.fase = 'voltando'; a.timer = 40 + (a.seed % 30); }      // usa a estação
    else { a.fase = 'indo'; a.timer = 60 + (a.seed % 45); }                          // digita na mesa
    return;
  }
  a.x += (tx - a.x) / d * 1.3; a.y += (ty - a.y) / d * 1.3; a.andando = true;
}

// ---------- chefe (Arthur) passeando pelo corredor e pelas salas ----------
const ROTA = [[20,166],[140,166],[140,120],[140,166],[300,166],[320,120],[300,166],[420,166],[420,120],[420,166],[240,166],[240,200],[240,166],[90,166],[90,210],[90,166]];
const chefe = { x:20, y:166, alvo:1, pausa:0, seed:5 };
function moverChefe() {
  if (noite()) return;
  if (chefe.pausa > 0) { chefe.pausa--; return; }
  const [tx, ty] = ROTA[chefe.alvo]; const dx = tx - chefe.x, dy = ty - chefe.y, d = Math.hypot(dx, dy);
  if (d < 1) { chefe.alvo = (chefe.alvo + 1) % ROTA.length; chefe.pausa = ty < 160 || ty > 175 ? 50 : 6; return; }
  chefe.x += dx / d * 1.1; chefe.y += dy / d * 1.1;
}

// ---------- loop ----------
let t = 0;
function quadro() {
  P('#0e1020', 0, 0, W, H);
  SALAS.forEach(s => sala(s, t));
  decoracao(t);
  const desenhos = [];
  AG.forEach(a => {
    const modo = estado(a.id);
    mover(a, modo);
    const naMesa = !a.andando && Math.abs(a.x - a.mesa[0]) < 1 && Math.abs(a.y - (a.mesa[1] - 6)) < 1;
    desenhos.push({ y: a.y + 14, f: () => {
      const px = a.x - 6, py = a.y - 14;
      if (!naMesa) pernas(px, py, t, a.andando, a);
      pessoa(px, py, a, t, naMesa ? modo : (modo === 'trabalhando' ? 'ocioso' : modo));
      if (modo === 'trabalhando' && !naMesa && !a.andando && t % 20 < 14) { P('#fff', px + 13, py - 7, 7, 5); P('#111', px + 14, py - 5, 1, 1); P('#111', px + 16, py - 5, 1, 1); P('#111', px + 18, py - 5, 1, 1); }
    } });
    desenhos.push({ y: a.mesa[1] + 1, f: () => mesaDe(a, t, naMesa ? modo : 'ocioso') });
  });
  const cmodo = noite() ? 'dormindo' : (AO_VIVO.agentes.chefe ? 'trabalhando' : 'ocioso');
  const cx = noite() ? 330 : chefe.x, cy = noite() ? 130 : chefe.y;
  desenhos.push({ y: cy, f: () => { const px = cx - 6, py = cy - 22; pernas(px, py, t, chefe.pausa === 0 && !noite(), chefe); pessoa(px, py, { ...CHEFE, seed:5 }, t, cmodo); } });
  desenhos.sort((a, b) => a.y - b.y).forEach(d => d.f());
  if (noite()) { g.fillStyle = 'rgba(10,14,40,.38)'; g.fillRect(0, 0, W, H); }
  moverChefe(); t++;
  posicionarRotulos();
}
setInterval(quadro, 1000 / 15);
