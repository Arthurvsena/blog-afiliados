<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Área restrita</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #050507; color: #B9B9C6; font: 16px/1.5 system-ui, sans-serif; padding: 16px; }
  form { width: min(360px, 100%); background: #101015; border: 1px solid #25252F; border-radius: 16px; padding: 28px; text-align: center; }
  svg { width: 40px; height: 40px; margin-bottom: 12px; }
  h1 { color: #F4F4F6; font-size: 1.25rem; margin: 0 0 6px; font-weight: 600; }
  p { margin: 0 0 18px; font-size: .92rem; }
  input[type=password] { width: 100%; font: inherit; color: #F4F4F6; background: #050507; border: 1px solid #25252F; border-radius: 10px; padding: 12px 14px; }
  input[type=password]:focus { outline: none; border-color: #7C5CFF; box-shadow: 0 0 0 4px rgba(124,92,255,.2); }
  label.lembrar { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: .85rem; margin: 12px 0 16px; }
  button { width: 100%; font: 500 1rem/1 system-ui, sans-serif; color: #fff; background: #7C5CFF; border: 0; border-radius: 999px; padding: 13px; cursor: pointer; }
  button:disabled { opacity: .6; }
  .erro { color: #FF6B6B; min-height: 1.4em; margin: 10px 0 0; font-size: .88rem; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <svg viewBox="0 0 24 24" fill="none" stroke="#A693FF" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
  <h1>Área restrita</h1>
  <p>Digite a senha para continuar.</p>
  <label for="s" style="position:absolute;left:-9999px">Senha</label>
  <input id="s" type="password" required autofocus>
  <label class="lembrar"><input type="checkbox" id="l"> Lembrar neste aparelho</label>
  <button id="b">Entrar</button>
  <p class="erro" id="e" role="alert"></p>
</form>
<script id="cofre" type="application/json">{{ cofre | safe }}</script>
<script>
(() => {
  const C = JSON.parse(document.getElementById('cofre').textContent);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const CHAVE = 'cofre-escritorio';
  async function abrir(senha) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
    const chave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(C.sal), iterations: C.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const claro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(C.iv) }, chave, b64(C.dados));
    const html = new TextDecoder().decode(claro);
    document.open(); document.write(html); document.close();
  }
  let salva = null; try { salva = localStorage.getItem(CHAVE); } catch (e) {}
  if (salva) abrir(salva).catch(() => { try { localStorage.removeItem(CHAVE); } catch (e) {} });
  document.getElementById('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const senha = document.getElementById('s').value, botao = document.getElementById('b'), erro = document.getElementById('e');
    botao.disabled = true; erro.textContent = '';
    try {
      if (document.getElementById('l').checked) { try { localStorage.setItem(CHAVE, senha); } catch (e) {} }
      await abrir(senha);
    } catch (e) { erro.textContent = 'Senha incorreta.'; botao.disabled = false; }
  });
})();
</script>
</body>
</html>
