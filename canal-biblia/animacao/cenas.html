<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Poppins"; font-weight: 700; src: url("fontes/Poppins-Bold.ttf"); }
  @font-face { font-family: "Lora"; font-weight: 400 700; src: url("fontes/Lora-Variable.ttf"); }
  @font-face { font-family: "Lora"; font-style: italic; font-weight: 400 700; src: url("fontes/Lora-Italic-Variable.ttf"); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="tela" width="1080" height="1920"></canvas>
<script>
/* ==========================================================================
   Histórias da Bíblia em 2D: cada cena é desenhada por código, quadro a quadro.
   renderFrame(t) desenha o instante t (segundos) da linha do tempo em window.TIMELINE.
   O montador (montar.py) injeta a linha do tempo com a duração real de cada narração.
   ========================================================================== */
const W = 1080, H = 1920;
const tela = document.getElementById("tela");
const ctx = tela.getContext("2d");

// ---------- utilidades ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const ease = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const seg = (p, a, b) => clamp((p - a) / (b - a));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function grad(c, x0, y0, x1, y1, stops) { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; }
function rgrad(c, x, y, r0, r, stops) { const g = c.createRadialGradient(x, y, r0, x, y, r); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; }
function glow(c, x, y, r, col, a = 1) { c.save(); c.globalAlpha *= a; c.globalCompositeOperation = "lighter"; c.fillStyle = rgrad(c, x, y, 0, r, [[0, col], [1, "rgba(0,0,0,0)"]]); c.fillRect(x - r, y - r, r * 2, r * 2); c.restore(); }
function sky(c, stops) { c.fillStyle = grad(c, 0, 0, 0, H, stops); c.fillRect(0, 0, W, H); }

// paleta
const SIL = "#160d1c";          // silhuetas
const SIL2 = "#24142b";
const TUNICA = ["#d8473f", "#f2b236", "#2fa59b", "#7d5bb0", "#ea7a3c", "#3d7fc4"];

// partículas de poeira/luz determinísticas
function poeira(c, n, seed, t, area, cor, tam = 3, vel = 18, alpha = 0.5) {
  const r = rng(seed);
  c.save(); c.globalCompositeOperation = "lighter";
  for (let i = 0; i < n; i++) {
    const x0 = area[0] + r() * area[2], y0 = area[1] + r() * area[3];
    const ph = r() * 6.28, s = tam * (0.4 + r());
    const x = x0 + Math.sin(t * 0.6 + ph) * 22 + t * vel * (r() - 0.3);
    const y = area[1] + ((y0 - area[1] - t * vel * (0.4 + r()) * 0.6) % area[3] + area[3]) % area[3];
    c.globalAlpha = alpha * (0.4 + 0.6 * Math.sin(t * 1.3 + ph * 2) ** 2);
    c.fillStyle = cor; c.beginPath(); c.arc(x, y, s, 0, 6.283); c.fill();
  }
  c.restore();
}

// ---------- personagens ----------
// p: {cor, tunica:'listras'|'branca'|null, colar, cabeca:'pano'|'nemes'|'nua', barba, olhar(1|-1),
//     bracoE, bracoD (rad, 0 = para baixo, + = para frente/cima), cajado, inclina}
function pessoa(c, x, y, h, p = {}) {
  const cor = p.cor || SIL, f = p.olhar || 1;
  c.save();
  c.translate(x, y); c.rotate(p.inclina || 0); c.translate(-x, -y);
  const hr = h * 0.072, hy = y - h + hr, oy = y - h * 0.80, ow = h * 0.125, bw = h * 0.19;
  const ombE = [x - ow * 0.92, oy + h * 0.015], ombD = [x + ow * 0.92, oy + h * 0.015];
  // braço de trás (fica atrás do corpo)
  // braços: ang = 0 aponta para baixo; positivo levanta para o lado em que a pessoa olha
  const braco = (o, ang) => {
    const L = h * 0.36;
    const ex = o[0] + Math.sin(ang * 0.6) * L * 0.5 * f, ey = o[1] + Math.cos(ang * 0.6) * L * 0.5;
    const mx = o[0] + Math.sin(ang) * L * f, my = o[1] + Math.cos(ang) * L;
    c.strokeStyle = cor; c.lineWidth = h * 0.058; c.lineCap = "round"; c.lineJoin = "round";
    c.beginPath(); c.moveTo(o[0], o[1]); c.quadraticCurveTo(ex, ey, mx, my); c.stroke();
    c.fillStyle = cor; c.beginPath(); c.arc(mx, my, h * 0.03, 0, 6.283); c.fill();
    return [mx, my];
  };
  const maoTras = braco(f > 0 ? ombE : ombD, p.bracoE ?? 0.12);
  if (p.cajado) {
    c.strokeStyle = cor; c.lineWidth = h * 0.022; c.beginPath();
    c.moveTo(maoTras[0], maoTras[1] - h * 0.32); c.lineTo(maoTras[0] + h * 0.02, y + 2); c.stroke();
    c.beginPath(); c.arc(maoTras[0] + h * 0.05, maoTras[1] - h * 0.32, h * 0.05, Math.PI, 2 * Math.PI); c.stroke();
  }
  // túnica
  const corpo = new Path2D();
  corpo.moveTo(x - ow, oy);
  corpo.quadraticCurveTo(x - ow * 1.25, y - h * 0.35, x - bw, y);
  corpo.lineTo(x + bw, y);
  corpo.quadraticCurveTo(x + ow * 1.25, y - h * 0.35, x + ow, oy);
  corpo.quadraticCurveTo(x, oy - h * 0.05, x - ow, oy);
  c.fillStyle = cor; c.fill(corpo);
  // pés
  c.beginPath(); c.ellipse(x - bw * 0.45 + f * 6, y, h * 0.05, h * 0.018, 0, 0, 6.283); c.ellipse(x + bw * 0.45 + f * 6, y, h * 0.05, h * 0.018, 0, 0, 6.283); c.fill();
  if (p.tunica === "listras") {
    c.save(); c.clip(corpo);
    const faixa = h * 0.085;
    for (let i = 0, yy = oy - 10; yy < y + 10; i++, yy += faixa) {
      c.fillStyle = TUNICA[i % TUNICA.length]; c.fillRect(x - bw - 5, yy, bw * 2 + 10, faixa + 1);
    }
    c.fillStyle = grad(c, x - bw, 0, x + bw, 0, [[0, "rgba(10,4,20,0.65)"], [0.45, "rgba(10,4,20,0)"], [0.7, "rgba(255,240,200,0.12)"], [1, "rgba(10,4,20,0.55)"]]);
    c.fillRect(x - bw - 5, oy - 10, bw * 2 + 10, h);
    c.restore();
  } else if (p.tunica === "branca") {
    c.save(); c.clip(corpo);
    c.fillStyle = grad(c, x - bw, 0, x + bw, 0, [[0, "#b9a98f"], [0.5, "#f4ead6"], [1, "#a8977e"]]);
    c.fillRect(x - bw - 5, oy - 10, bw * 2 + 10, h);
    c.fillStyle = "rgba(180,130,40,0.85)"; c.fillRect(x - bw - 5, y - h * 0.06, bw * 2 + 10, h * 0.025);
    c.restore();
  }
  // pescoço e cabeça
  c.fillStyle = cor;
  c.fillRect(x - h * 0.028, oy - h * 0.07, h * 0.056, h * 0.08);
  if (p.cabeca === "nemes") {
    c.fillStyle = cor; c.beginPath();
    c.moveTo(x - hr * 1.05, hy - hr * 0.6); c.lineTo(x - hr * 1.9, oy + h * 0.06); c.lineTo(x + hr * 1.9, oy + h * 0.06); c.lineTo(x + hr * 1.05, hy - hr * 0.6); c.closePath(); c.fill();
    c.beginPath(); c.arc(x, hy, hr * 1.15, Math.PI, 0); c.fill();
    c.strokeStyle = "rgba(240,190,80,0.9)"; c.lineWidth = h * 0.008;
    for (let i = 1; i < 6; i++) { const k = i / 6; c.beginPath(); c.moveTo(x - lerp(hr * 1.05, hr * 1.9, k), lerp(hy - hr * 0.6, oy + h * 0.06, k)); c.lineTo(x + lerp(hr * 1.05, hr * 1.9, k), lerp(hy - hr * 0.6, oy + h * 0.06, k)); c.stroke(); }
  } else if (p.cabeca === "pano") {
    c.beginPath(); c.moveTo(x - hr * 1.1, hy); c.quadraticCurveTo(x - hr * 1.5, oy, x - hr * 1.7, oy + h * 0.05); c.lineTo(x + hr * 1.7, oy + h * 0.05); c.quadraticCurveTo(x + hr * 1.5, oy, x + hr * 1.1, hy); c.fill();
    c.beginPath(); c.arc(x, hy, hr * 1.12, 0, 6.283); c.fill();
  }
  c.fillStyle = cor;
  c.beginPath(); c.arc(x + f * hr * 0.12, hy, hr, 0, 6.283); c.fill();
  // nariz (perfil) e barba
  c.beginPath(); c.moveTo(x + f * hr * 0.95, hy - hr * 0.1); c.lineTo(x + f * hr * 1.28, hy + hr * 0.25); c.lineTo(x + f * hr * 0.9, hy + hr * 0.35); c.fill();
  if (p.barba) { c.beginPath(); c.moveTo(x - f * hr * 0.2, hy + hr * 0.6); c.quadraticCurveTo(x + f * hr * 0.4, hy + hr * 2.1, x + f * hr * 0.95, hy + hr * 0.55); c.fill(); }
  if (p.colar) {
    c.strokeStyle = "#f0bf4c"; c.lineWidth = h * 0.03;
    c.beginPath(); c.ellipse(x, oy + h * 0.005, ow * 0.95, h * 0.05, 0, 0.1, Math.PI - 0.1); c.stroke();
    glow(c, x, oy + h * 0.04, h * 0.15, "rgba(255,200,90,0.35)");
  }
  // braço da frente
  braco(f > 0 ? ombD : ombE, p.bracoD ?? 0.12);
  c.restore();
}

// ajoelhado, visto de costas (irmãos diante de José)
function ajoelhadoCostas(c, x, y, h, cor = SIL, cabecaBaixa = 0) {
  c.fillStyle = cor;
  c.beginPath();
  c.moveTo(x - h * 0.24, y);
  c.quadraticCurveTo(x - h * 0.27, y - h * 0.3, x - h * 0.15, y - h * 0.42);
  c.quadraticCurveTo(x, y - h * 0.5, x + h * 0.15, y - h * 0.42);
  c.quadraticCurveTo(x + h * 0.27, y - h * 0.3, x + h * 0.24, y);
  c.closePath(); c.fill();
  const hy = y - h * 0.5 + cabecaBaixa * h * 0.08;
  c.beginPath(); c.moveTo(x - h * 0.09, hy); c.lineTo(x - h * 0.13, y - h * 0.36); c.lineTo(x + h * 0.13, y - h * 0.36); c.lineTo(x + h * 0.09, hy); c.fill();
  c.beginPath(); c.arc(x, hy, h * 0.085, 0, 6.283); c.fill();
  // saco vazio no chão
  c.fillStyle = "#2b1a24"; c.beginPath(); c.ellipse(x + h * 0.3, y - h * 0.05, h * 0.09, h * 0.06, 0.3, 0, 6.283); c.fill();
}

// sentado abraçando os joelhos (prisão), de perfil
function sentado(c, x, y, h, listras = true, f = 1) {
  const corpo = new Path2D();
  corpo.moveTo(x - f * h * 0.12, y);
  corpo.quadraticCurveTo(x - f * h * 0.2, y - h * 0.3, x - f * h * 0.06, y - h * 0.5);
  corpo.lineTo(x + f * h * 0.08, y - h * 0.48);
  corpo.quadraticCurveTo(x + f * h * 0.14, y - h * 0.42, x + f * h * 0.24, y - h * 0.33);
  corpo.quadraticCurveTo(x + f * h * 0.3, y - h * 0.15, x + f * h * 0.28, y);
  corpo.closePath();
  c.fillStyle = SIL; c.fill(corpo);
  if (listras) {
    c.save(); c.clip(corpo);
    for (let i = 0; i < 10; i++) { c.fillStyle = TUNICA[i % TUNICA.length]; c.fillRect(x - h * 0.4, y - h * 0.55 + i * h * 0.07, h * 0.8, h * 0.071); }
    c.fillStyle = "rgba(8,14,40,0.38)"; c.fillRect(x - h * 0.4, y - h * 0.6, h * 0.8, h * 0.7);
    c.restore();
  }
  c.fillStyle = SIL;
  c.beginPath(); c.arc(x + f * h * 0.05, y - h * 0.58, h * 0.075, 0, 6.283); c.fill();
  // braços em volta dos joelhos
  c.strokeStyle = SIL; c.lineWidth = h * 0.05; c.lineCap = "round";
  c.beginPath(); c.moveTo(x + f * h * 0.0, y - h * 0.44); c.quadraticCurveTo(x + f * h * 0.12, y - h * 0.22, x + f * h * 0.27, y - h * 0.25); c.stroke();
}

function camelo(c, x, y, s, fase, cor = SIL) {
  c.fillStyle = cor; c.strokeStyle = cor; c.lineCap = "round";
  c.lineWidth = s * 0.06;
  for (let i = 0; i < 4; i++) {
    const lx = x + (i < 2 ? -0.22 : 0.2) * s + (i % 2) * 0.06 * s;
    const a = Math.sin(fase + (i % 2 ? Math.PI : 0) + (i < 2 ? 0 : Math.PI * 0.5)) * 0.32;
    c.beginPath(); c.moveTo(lx, y - s * 0.56); c.lineTo(lx + Math.sin(a) * s * 0.28, y - s * 0.28); c.lineTo(lx + Math.sin(a * 1.4) * s * 0.3, y); c.stroke();
  }
  c.beginPath(); c.ellipse(x, y - s * 0.62, s * 0.33, s * 0.14, 0, 0, 6.283); c.fill();
  c.beginPath(); c.ellipse(x - s * 0.04, y - s * 0.76, s * 0.16, s * 0.13, 0, 0, 6.283); c.fill();
  c.lineWidth = s * 0.1;
  c.beginPath(); c.moveTo(x + s * 0.26, y - s * 0.64); c.quadraticCurveTo(x + s * 0.44, y - s * 0.62, x + s * 0.44, y - s * 0.93); c.stroke();
  c.beginPath(); c.ellipse(x + s * 0.5, y - s * 0.95, s * 0.1, s * 0.05, 0.2, 0, 6.283); c.fill();
  c.fillRect(x - s * 0.17, y - s * 0.98, s * 0.26, s * 0.12); // carga
}

function palmeira(c, x, y, h, cor = SIL, vento = 0) {
  c.strokeStyle = cor; c.lineWidth = h * 0.045; c.lineCap = "round";
  c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + h * 0.12, y - h * 0.5, x + h * 0.05, y - h); c.stroke();
  const tx = x + h * 0.05, ty = y - h;
  c.fillStyle = cor;
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI / 2 + (i - 3) * 0.48 + Math.sin(vento + i) * 0.04;
    c.save(); c.translate(tx, ty); c.rotate(a);
    c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(h * 0.25, -h * 0.09, h * 0.42, h * 0.08); c.quadraticCurveTo(h * 0.22, -h * 0.01, 0, h * 0.03); c.fill();
    c.restore();
  }
}

function piramide(c, x, y, w, h, luz, sombra) {
  c.fillStyle = luz; c.beginPath(); c.moveTo(x - w / 2, y); c.lineTo(x, y - h); c.lineTo(x + w * 0.12, y); c.fill();
  c.fillStyle = sombra; c.beginPath(); c.moveTo(x + w * 0.12, y); c.lineTo(x, y - h); c.lineTo(x + w / 2, y); c.fill();
}

function duna(c, y0, amp, freq, fase, cor) {
  c.fillStyle = cor; c.beginPath(); c.moveTo(-20, H + 20);
  for (let x = -20; x <= W + 20; x += 20) c.lineTo(x, y0 + Math.sin(x * freq + fase) * amp + Math.sin(x * freq * 2.3 + fase * 1.7) * amp * 0.35);
  c.lineTo(W + 20, H + 20); c.closePath(); c.fill();
}

function vaca(c, x, y, s, magra, cor) {
  c.fillStyle = cor; c.strokeStyle = cor; c.lineWidth = s * 0.06; c.lineCap = "round";
  const bh = magra ? s * 0.16 : s * 0.3;
  for (const lx of [-0.3, -0.18, 0.18, 0.3]) { c.beginPath(); c.moveTo(x + lx * s, y - s * 0.4); c.lineTo(x + lx * s, y); c.stroke(); }
  c.beginPath(); c.ellipse(x, y - s * 0.5, s * 0.42, bh / 2 + s * 0.05, 0, 0, 6.283); c.fill();
  c.beginPath(); c.ellipse(x + s * 0.5, y - s * 0.6, s * 0.12, s * 0.09, 0.4, 0, 6.283); c.fill();
  c.beginPath(); c.moveTo(x + s * 0.48, y - s * 0.68); c.lineTo(x + s * 0.44, y - s * 0.8); c.stroke();
}

// ==========================================================================
//  CENAS  (u = segundos dentro da cena, d = duração da cena)
// ==========================================================================
const CENAS = {};

// 1. O poço — câmera desce dos irmãos até José no fundo
CENAS.poco = (c, u, d) => {
  const p = u / d;
  const cam = ease(seg(p, 0.05, 0.85));
  sky(c, [[0, "#3a1d3f"], [0.25, "#b0473f"], [0.4, "#e88a4a"], [1, "#e88a4a"]]);
  c.save();
  const k = lerp(1.55, 1.0, cam), fy = lerp(380, 900, cam);
  c.translate(W / 2, H / 2); c.scale(k, k); c.translate(-W / 2, -fy);
  const solo = 560, poX = 540, poW = 280;
  glow(c, 540, solo - 40, 520, "rgba(255,170,90,0.55)");
  // terra em corte
  c.fillStyle = grad(c, 0, solo, 0, H + 200, [[0, "#3b2219"], [0.5, "#24130f"], [1, "#120808"]]);
  c.fillRect(-200, solo, W + 400, H);
  const r = rng(7); c.fillStyle = "rgba(255,200,150,0.06)";
  for (let i = 0; i < 70; i++) { c.beginPath(); c.ellipse(r() * W, solo + 40 + r() * 1400, 10 + r() * 30, 6 + r() * 12, 0, 0, 6.283); c.fill(); }
  // poço (pedras nas bordas)
  c.fillStyle = "#0c0507"; c.fillRect(poX - poW / 2, solo, poW, 900);
  for (let yy = solo; yy < solo + 900; yy += 46) {
    for (const lado of [-1, 1]) {
      c.fillStyle = (yy / 46) % 2 ? "#4a2d22" : "#3a2219";
      c.beginPath(); c.roundRect(poX + lado * poW / 2 - (lado > 0 ? 0 : 36), yy + 2, 36, 42, 6); c.fill();
    }
  }
  // feixe de luz descendo
  c.save(); c.globalCompositeOperation = "lighter";
  c.fillStyle = grad(c, 0, solo, 0, solo + 1180, [[0, "rgba(255,190,120,0.42)"], [1, "rgba(255,190,120,0.05)"]]);
  c.beginPath(); c.moveTo(poX - poW / 2 + 36, solo); c.lineTo(poX + poW / 2 - 36, solo); c.lineTo(poX + 60, solo + 900); c.lineTo(poX - 60, solo + 900); c.fill(); c.restore();
  poeira(c, 26, 3, u, [poX - 110, solo, 220, 880], "rgba(255,210,160,1)", 2.5, 30, 0.6);
  // José no fundo, olhando para cima
  const fundo = solo + 890;
  glow(c, poX, fundo - 120, 260, "rgba(255,200,140,0.35)");
  pessoa(c, poX, fundo, 260, { tunica: "listras", bracoE: 2.4 + Math.sin(u * 2) * 0.05, bracoD: 0.25, inclina: -0.04 });
  // irmãos na beira, olhando para baixo
  const irm = [[poX - 250, 0.18, -1], [poX - 380, 0.1, 1], [poX + 250, -0.18, -1], [poX + 390, -0.08, 1]];
  irm.forEach(([ix, inc, ord], i) => pessoa(c, ix, solo, 300 + i * 12, { cabeca: "pano", olhar: ix < poX ? 1 : -1, inclina: inc + Math.sin(u * 1.2 + i) * 0.015, bracoE: 0.35, bracoD: i === 0 ? 1.2 : 0.4, barba: i % 2 === 0, cor: i % 2 ? SIL2 : SIL }));
  c.fillStyle = "#2a1712"; c.fillRect(-200, solo - 2, poX - poW / 2 + 200, 14); c.fillRect(poX + poW / 2, solo - 2, W, 14);
  c.restore();
};

// 2. A túnica colorida — o pai dá a túnica; os irmãos olham no escuro
CENAS.tunica = (c, u, d) => {
  const p = u / d;
  sky(c, [[0, "#2c1a45"], [0.35, "#8a3c5a"], [0.6, "#f08a4b"], [0.75, "#f8c76a"], [1, "#f8c76a"]]);
  c.save();
  const k = lerp(1.0, 1.12, ease(p)); c.translate(W / 2, H * 0.62); c.scale(k, k); c.translate(-W / 2, -H * 0.62);
  glow(c, 560, 1180, 420, "rgba(255,220,140,0.8)");
  c.fillStyle = "#fff3cf"; c.beginPath(); c.arc(560, 1180, 150, 0, 6.283); c.fill();
  duna(c, 1250, 30, 0.004, 1, "#7a3a44");
  duna(c, 1330, 22, 0.006, 3, "#4a2233");
  // tenda
  c.fillStyle = SIL2; c.beginPath(); c.moveTo(60, 1360); c.lineTo(230, 1140); c.lineTo(420, 1360); c.fill();
  c.strokeStyle = SIL2; c.lineWidth = 6; c.beginPath(); c.moveTo(230, 1140); c.lineTo(230, 1100); c.stroke();
  palmeira(c, 930, 1360, 380, SIL2, u);
  c.fillStyle = "#2a1626"; c.fillRect(-100, 1355, W + 200, 700);
  // pai e José
  const reveal = easeOut(seg(p, 0.05, 0.4));
  glow(c, 600, 1180, 300, "rgba(255,200,120,0.6)", reveal);
  pessoa(c, 470, 1360, 430, { cabeca: "pano", barba: true, cajado: true, olhar: 1, bracoD: lerp(0.3, 1.25, reveal), bracoE: 0.15, inclina: 0.04 });

};

// ==========================================================================
//  LEGENDAS (grupos de até 4 palavras; a palavra falada fica dourada)
// ==========================================================================
function gruposLegenda(fala) {
  const ws = fala.replace(/…/g, "… ").split(/\s+/).filter(Boolean);
  const grupos = []; let g = [];
  ws.forEach(w => { g.push(w); if (g.length >= 4 || /[.,?!…:]$/.test(w)) { grupos.push(g); g = []; } });
  if (g.length) grupos.push(g);
  return grupos;
}
const LEG_Y = { caravana: 1470 };
function legenda(c, cena, u) {
  if (!cena.fala || cena.id === "versiculo") return;
  const grupos = gruposLegenda(cena.fala);
  const total = cena.falaDur || cena.dur;
  const peso = w => w.replace(/[^\p{L}\p{N}]/gu, "").length + 2 + (/[.?!…]$/.test(w) ? 5 : /[,:]$/.test(w) ? 2 : 0);
  const todos = grupos.flat(); const soma = todos.reduce((a, w) => a + peso(w), 0);
  let acc = 0, gi = -1, wi = -1, inicioG = 0;
  for (let i = 0, k = 0; i < grupos.length; i++) {
    const ini = acc;
    for (let j = 0; j < grupos[i].length; j++, k++) {
      const t0 = acc * total / soma; acc += peso(grupos[i][j]);
      if (u >= t0) { gi = i; wi = j; inicioG = ini * total / soma; }
    }
  }
  if (gi < 0 || u > total + 0.15) return;
  const g = grupos[gi];
  const pop = easeOut(clamp((u - inicioG) / 0.12));
  c.save(); c.font = "700 84px Poppins"; c.textAlign = "left"; c.textBaseline = "middle";
  const txt = g.map(w => w.toUpperCase());
  const esp = c.measureText(" ").width;
  // quebra em até 2 linhas
  const linhas = [[]]; let larg = 0;
  txt.forEach((w, i) => { const lw = c.measureText(w).width; if (larg + lw > 900 && linhas[linhas.length - 1].length) { linhas.push([]); larg = 0; } linhas[linhas.length - 1].push(i); larg += lw + esp; });
  const y0 = (LEG_Y[cena.id] || 1640) - (linhas.length - 1) * 50;
  c.translate(540, y0); c.scale(lerp(0.85, 1, pop), lerp(0.85, 1, pop)); c.translate(-540, -y0);
  linhas.forEach((ln, li) => {
    const largura = ln.reduce((a, i) => a + c.measureText(txt[i]).width, 0) + esp * (ln.length - 1);
    let x = 540 - largura / 2; const y = y0 + li * 100;
    ln.forEach(i => {
      c.lineJoin = "round"; c.lineWidth = 16; c.strokeStyle = "rgba(10,5,12,0.92)"; c.strokeText(txt[i], x, y);
      c.fillStyle = i === wi ? "#ffd04a" : "#ffffff"; c.fillText(txt[i], x, y);
      x += c.measureText(txt[i]).width + esp;
    });
  });
  c.restore();
}

// ==========================================================================
//  ACABAMENTO: vinheta e granulação
// ==========================================================================
const grao = document.createElement("canvas"); grao.width = 512; grao.height = 512;
(() => { const g = grao.getContext("2d"), im = g.createImageData(512, 512), r = rng(99); for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 18; } g.putImageData(im, 0, 0); })();
function acabamento(c, t) {
  c.fillStyle = rgrad(c, W / 2, H / 2, H * 0.3, H * 0.75, [[0, "rgba(0,0,0,0)"], [1, "rgba(0,0,0,0.55)"]]); c.fillRect(0, 0, W, H);
  c.save(); c.globalCompositeOperation = "overlay"; const ox = Math.floor(t * 997) % 512, oy = Math.floor(t * 613) % 512;
  c.translate(-ox, -oy); for (let x = 0; x < W + 512; x += 512) for (let y = 0; y < H + 512; y += 512) c.drawImage(grao, x, y); c.restore();
}

const camadaA = document.createElement("canvas"); camadaA.width = W; camadaA.height = H;
const cA = camadaA.getContext("2d");
const FUSAO = 0.35;
function desenharCena(c, cena, u) { c.save(); c.clearRect(0, 0, W, H); CENAS[cena.id](c, u, cena.dur, cena); c.restore(); }

window.renderFrame = function (t) {
  const TL = window.TIMELINE;
  let i = TL.cenas.findIndex(s => t < s.start + s.dur);
  if (i < 0) i = TL.cenas.length - 1;
  const cena = TL.cenas[i], u = t - cena.start;
  ctx.save(); ctx.clearRect(0, 0, W, H);
  desenharCena(ctx, cena, u);
  if (i > 0 && u < FUSAO) { // fusão com a cena anterior
    const ant = TL.cenas[i - 1];
    desenharCena(cA, ant, ant.dur + u);
    ctx.globalAlpha = 1 - ease(u / FUSAO); ctx.drawImage(camadaA, 0, 0); ctx.globalAlpha = 1;
  }
  acabamento(ctx, t);
  legenda(ctx, cena, u);
  // abertura e encerramento
  const fimT = TL.total;
  const preto = Math.max(clamp(1 - t / 0.25), clamp((t - (fimT - 0.5)) / 0.5));
  if (preto > 0) { ctx.fillStyle = `rgba(0,0,0,${preto})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
  return true;
};
window.quadroJpeg = function (t, q) { renderFrame(t); return tela.toDataURL("image/jpeg", q || 0.92); };
window.pronto = document.fonts.ready.then(() => Promise.all([
  document.fonts.load("700 80px Poppins"), document.fonts.load("italic 600 80px Lora")]));
</script>
</body>
</html>
