/*

import * as THREE from 'three';

const W = 1080, H = 1920;

const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, a, b) => b <= a ? (t >= a ? 1 : 0) : clamp((t - a) / (b - a));
const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');

// ---------------- renderer ----------------
const glCanvas = document.createElement('canvas');

const scene = new THREE.Scene();

const MATS = {};
function mat(c, o = {}) {

  if (!MATS[k]) MATS[k] = new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, metalness: 0, flatShading: true, ...o });
  return MATS[k];
}
const own = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, flatShading: true, ...o });
function box(w, h, d, m, x, y, z, parent) {
  const g = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof m === 'string' ? mat(m) : m);
  g.position.set(x, y, z); g.castShadow = true; g.receiveShadow = true; parent.add(g); return g;
}
function cyl(rt, rb, h, m, x, y, z, parent, seg = 10) {
  const g = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), typeof m === 'string' ? mat(m) : m);
  g.position.set(x, y, z); g.castShadow = true; g.receiveShadow = true; parent.add(g); return g;
}
function plane(w, h, m, parent) { const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), typeof m === 'string' ? mat(m) : m); p.receiveShadow = true; parent.add(p); return p; }

  box(1.8, 0.45, 0.8, '#5b6ee1', 0, 0.35, 0, sofa); box(1.8, 0.7, 0.22, '#4b5bd0', 0, 0.75, -0.3, sofa);
  box(0.22, 0.6, 0.8, '#4b5bd0', -0.9, 0.45, 0, sofa); box(0.22, 0.6, 0.8, '#4b5bd0', 0.9, 0.45, 0, sofa);
  cyl(0.22, 0.17, 0.4, '#e2725b', 3.4, 0.2, -0.4, g, 8);
  const lv = new THREE.Mesh(new THREE.IcosahedronGeometry(0.45, 0), mat('#3fae5a')); lv.position.set(3.4, 0.75, -0.4); lv.castShadow = true; g.add(lv);

function ambBanheiro() {

  for (let y = 0.25; y < 6; y += 0.5) box(12, 0.02, 0.01, '#9ccbee', 0, y, -2.59, g);

for (const [k, f] of Object.entries({ sala: ambSala, banheiro: ambBanheiro, cozinha: ambCozinha })) {

  for (let i = 0; i < pts.length - 1; i++) curva.add(new THREE.LineCurve3(pts[i], pts[i + 1]));
  const m = new THREE.Mesh(new THREE.TubeGeometry(curva, 64, 0.035, 6, false), own(cor, { emissive: cor, emissiveIntensity: 0.5 }));
  fios.add(m); return curva;
}
const SW = V(-1.2, 1.25, -2.5);
const FASE = tubo([V(-2.6, 4.22, -2.5), V(-2.6, 4.22, -0.3), V(0, 4.22, -0.3), V(0, 4.22, 0), V(0, 3.45, 0)], '#ff3b3b');
const NEUT = tubo([V(0.06, 3.45, 0), V(0.06, 4.18, 0), V(0.06, 4.18, -2.5), V(-1.2, 4.18, -2.5), V(-1.2, 1.25, -2.5)], '#2f7bff');
const NEUT2 = tubo([V(-1.15, 1.25, -2.5), V(-1.15, 0.2, -2.5), V(-2.9, 0.2, -2.5)], '#2f7bff');
const pulsos = [];
for (let i = 0; i < 6; i++) { const p = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), mat('#fff27a', { emissive: '#ffe600', emissiveIntensity: 2 })); fios.add(p); pulsos.push(p); }

const body = new THREE.Group(); person.add(body);

const legR = new THREE.Group(); legR.position.set(0.15, 0.8, 0); body.add(legR);
for (const l of [legL, legR]) { box(0.24, 0.8, 0.26, pMats.jeans, 0, -0.4, 0, l); box(0.26, 0.12, 0.36, pMats.shoe, 0, -0.76, 0.04, l); }
box(0.64, 0.7, 0.36, pMats.shirt, 0, 1.15, 0, body); box(0.66, 0.1, 0.38, pMats.belt, 0, 0.84, 0, body);
const armL = new THREE.Group(); armL.position.set(-0.42, 1.45, 0); body.add(armL);

{ const hm = own('#ffb300', { roughness: 0.45 });
  const d = new THREE.Mesh(new THREE.SphereGeometry(0.36, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), hm); d.position.y = 0.5; d.scale.set(1, 0.9, 1); helmet.add(d);
  box(0.64, 0.05, 0.66, hm, 0, 0.5, 0.08, helmet); }

function resetPerson() {
  person.position.set(0, 0, 0); person.rotation.set(0, 0, 0); body.position.set(0, 0, 0); body.rotation.set(0, 0, 0);

// aponta um braço (grupo com o eixo -Y) para um ponto do mundo
function aimArm(arm, alvo, k = 1) {
  if (k <= 0) return;
  person.updateMatrixWorld(true);
  const ombro = arm.getWorldPosition(new THREE.Vector3());
  const dir = alvo.clone().sub(ombro).normalize();
  const inv = new THREE.Quaternion(); arm.parent.getWorldQuaternion(inv); inv.invert();
  dir.applyQuaternion(inv);
  const q = new THREE.Quaternion().setFromUnitVectors(V(0, -1, 0), dir);
  arm.quaternion.slerp(q, k);

// ---------------- objetos ----------------
const props = new THREE.Group(); scene.add(props);
const OBJ = {};   // id -> {tipo, g, ancora(nome) -> Vector3, topo, partes}

const FAB = {
